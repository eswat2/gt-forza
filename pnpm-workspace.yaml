  - '@vercel/rust@26.0.1'
  - '@vercel/vc-native-darwin-arm64@65.14.0'
  - '@vercel/vc-native-darwin-x64@65.14.0'
  - '@vercel/vc-native-linux-arm64-musl@65.14.0'
  - '@vercel/vc-native-linux-arm64@65.14.0'
  - '@vercel/vc-native-linux-x64-musl@65.14.0'
  - '@vercel/vc-native-linux-x64@65.14.0'
  - '@vercel/vc-native-win32-arm64@65.14.0'
  - '@vercel/vc-native-win32-x64@65.14.0'
  - vercel@65.14.0
