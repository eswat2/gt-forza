  'koffi': true
  'proto-tailwindcss-clrs': true

minimumReleaseAgeExclude:
  - '@vercel/cli-auth@0.3.15'
  - '@vercel/cli-config@0.3.6'
  - '@vercel/cli-support@65.10.0'
  - '@vercel/python-analysis@0.15.3'
  - '@vercel/python@30.1.0'
  - '@vercel/vc-native-darwin-arm64@65.10.0'
  - '@vercel/vc-native-darwin-x64@65.10.0'
  - '@vercel/vc-native-linux-arm64-musl@65.10.0'
  - '@vercel/vc-native-linux-arm64@65.10.0'
  - '@vercel/vc-native-linux-x64-musl@65.10.0'
  - '@vercel/vc-native-linux-x64@65.10.0'
  - '@vercel/vc-native-win32-arm64@65.10.0'
  - '@vercel/vc-native-win32-x64@65.10.0'
  - vercel@65.10.0
